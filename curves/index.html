<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parametric Curves in Color Space</title>
  <link rel="stylesheet" href="../lib/applet.css">
</head>
<body>

<main class="layout">

  <!-- ---------------- controls ---------------- -->
  <section class="panel panel-controls">
    <h2>Parametric Curves<br/>in Color Space</h2>
    <a href="https://cheque.github.io/"><p class="caption">Cheque Soto</p></a>
    <p class="links">
      [<a href="https://archive.bridgesmathart.org/2023/bridges2023-181.html" target="_blank" rel="noopener">Bridges 2023</a> &middot;
      <a href="https://gallery.bridgesmathart.org/exhibitions/2023-bridges-conference/jose-ezequiel-soto-sanchez" target="_blank" rel="noopener">Art Exhibition</a> &middot;
      <a href="http://chequesoto.info/color/docs/2023-ParametricCurvesColorSpace.pdf" target="_blank" rel="noopener">pdf</a>]
    </p>
    <p class="links">[<a href="widget.html">widget</a> &middot; <a href="https://github.com/cheque/color-lab" target="_blank" rel="noopener">github</a>]</p>

    <!-- Every control below is generated from PARAM_SPECS in src/params.js. -->
    <div id="controls"></div>

    <!-- The palette, at the foot of the panel. Nothing moves it: it is here
         in the markup because here is where it appears. The copy/json/gimp
         buttons live inside the Export box above, built by
         buildExportButtons() in src/app.js. -->
    <div class="palette-out">
      <div id="swatches" class="swatches"></div>
      <p id="evenness" class="caption"></p>
    </div>

  </section>

  <!-- ---------------- gradient + palette ---------------- -->
  <section class="panel panel-gradient">
    <canvas id="gradient" aria-label="Colour gradient along the curve"></canvas>
    <p class="caption">full curve &middot; clipped to [ta, tb] &middot; perceptually respaced &middot; palette</p>

    <div class="actions">
      <button type="button" id="reset">Reset</button>
      <button type="button" id="clear" title="Empty the 3-D canvas">Clear</button>
      <button type="button" id="permalink">Copy link</button>
    </div>
  </section>

  <!-- ---------------- 3-D view ---------------- -->
  <section class="panel panel-curve">
    <p class="caption">Click &amp; drag to rotate the view</p>
    <canvas id="curve" aria-label="The curve inside the HSL colour cylinder"></canvas>
  </section>

</main>

<div id="status" class="status" role="status" aria-live="polite"></div>

<footer id="footer">
  <a href="../index.html">&larr; Color Lab</a>
</footer>

<!--
  Load order matters: each file uses the ones above it.
  Plain classic scripts on purpose, so index.html still opens straight from the
  filesystem with no server and no build step. See WIDGET_PLAN.md for the ES
  module packaging.
-->
<script src="../lib/color.js"></script>
<script src="src/curve.js"></script>
<script src="../lib/reparam.js"></script>
<script src="../lib/palette.js"></script>
<script src="src/params.js"></script>
<script src="../lib/rangepair.js"></script>
<script src="../lib/scene.js"></script>
<script src="src/app.js"></script>

</body>
</html>
